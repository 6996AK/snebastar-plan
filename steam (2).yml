name: Steam achievements
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: write test snapshots only, the live bot is not affected"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: steam-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read finished games from Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TEST_MODE: ${{ inputs.test }}
          FINISH_TABLE: '{"pragmata":{"app":3357650,"ach":["9"]},"hellraiser":{"app":1551980,"ach":["ACH_EXPERIENCE_BEYOND_LIMITS","ACH_HUMAN_AFTER_ALL"]},"doom-tda":{"app":3017860,"ach":["NEW_ACHIEVEMENT_1_7"]},"re2":{"app":883710,"ach":["NEW_ACHIEVEMENT_1_7","NEW_ACHIEVEMENT_1_8"]},"gta3":{"app":1546970,"ach":["ACH18"]},"gtavc":{"app":1546990,"ach":["ACH30"]},"gtasa":{"app":1547000,"ach":["ACH03"]},"gta4":{"app":12210,"ach":["STORYDONE"]},"re7":{"app":418370,"ach":["ACHIEVEMENT_07","ACHIEVEMENT_08"]},"inscryption":{"app":1092790,"ach":["STORY_PROGRESS_9"]},"rdr2":{"app":1174180,"ach":["Achievement10"]},"stray":{"app":1332010,"ach":["ACH_016"]},"witcher3":{"app":292030,"ach":["PASSED_THE_TRIAL"]},"doom2016":{"app":379720,"ach":["ach_6"]},"eternal":{"app":782330,"ach":["NEW_ACHIEVEMENT_1_7"]},"deadspace":{"app":1693980,"ach":["ach12"]},"callisto":{"app":1544020,"ach":["FINISH_GAME"]},"untildawn":{"app":2172010,"ach":["TRP_CABIN"]},"re4":{"app":2050650,"ach":["28","30","32"]},"village":{"app":1196590,"ach":["10"]},"dis2":{"app":403640,"ach":["ACH_42","ACH_43"]},"e33":{"app":1903340,"ach":["THE_END"]},"tno":{"app":201810,"ach":["ach_9"]},"ds":{"app":1850570,"ach":["015"]},"wolf2":{"app":612880,"ach":["ach_21"]},"ratchet":{"app":1895880,"ach":["Complete_Fin"]},"se5":{"app":1029690,"ach":["REWARD_11_GAME_SUBTITLE"]},"gotg":{"app":1088850,"ach":["NEW_ACHIEVEMENT_16"]},"hellisus":{"app":1620730,"ach":["Act03_Complete"]},"kcd":{"app":379430,"ach":["TheEnd"]},"kcd2":{"app":1771300,"ach":["22"]},"crimson":{"app":3321460,"ach":["ExpertStoryteller"]},"gears5":{"app":1097840,"ach":["CompleteAllActsOfCampaignAnyDifficulty"]},"evilwest":{"app":1065310,"ach":["ACH_GAME_COMPLETED"]},"bo1":{"app":42700,"ach":["SP_WIN_UNDERWATERBASE"]},"roboquest":{"app":692890,"ach":["FINISH_GAME"]},"ds2":{"app":3280350,"ach":["trophy_016"]},"bo2":{"app":202970,"ach":["SP_RTS_CARRIER"]},"wwii":{"app":476600,"ach":["LEVEL_11"]},"bo3":{"app":311210,"ach":["CP_CAMPAIGN_COMPLETE"]}}'
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          STEAM_ID = '76561198861373469'
          KEY = os.environ.get('STEAM_API_KEY','')
          TEST = os.environ.get('TEST_MODE') == 'true'
          GAMES = json.loads(os.environ['FINISH_TABLE'])
          if TEST:
              GAMES['p-tlou2'] = {'app': 2531310, 'ach': ['1138aa8adde81250']}
          CUTOFF = 0 if TEST else int(datetime(2026, 10, 24, tzinfo=timezone.utc).timestamp())
          NOW = int(time.time())
          OUT = Path('steam-test.json' if TEST else 'steam.json')
          DETAILS = Path('steam-achievements-test' if TEST else 'steam-achievements')

          def read(path, default):
              if not path.exists(): return default
              return json.loads(path.read_text(encoding='utf-8'))

          def write(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix('.tmp')
              tmp.write_text(json.dumps(obj, ensure_ascii=False, sort_keys=True, separators=(',', ':'))+'\n', encoding='utf-8')
              tmp.replace(path)

          def request(url, params):
              try:
                  req = urllib.request.Request(url+'?'+urllib.parse.urlencode(params), headers={'User-Agent':'SnebaStar Steam sync/2.2'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: return e.code, json.load(e)
                  except Exception: return e.code, {}
              except Exception: return 0, {}
              finally: time.sleep(.25)

          def api(method, params):
              return request('https://api.steampowered.com/'+method+'/', {'key':KEY, **params})

          def player(app):
              code, body = api('ISteamUserStats/GetPlayerAchievements/v1', {'steamid':STEAM_ID,'appid':app,'l':'russian'})
              stats = body.get('playerstats',{}) if isinstance(body,dict) else {}
              return code, stats if isinstance(stats,dict) else {}

          def owned():
              code, body = api('IPlayerService/GetOwnedGames/v1', {'steamid':STEAM_ID,'include_appinfo':1,'include_played_free_games':1})
              r = body.get('response',{}) if isinstance(body,dict) else {}
              games = r.get('games') if isinstance(r,dict) else None
              if code != 200 or not isinstance(games,list) or not games:
                  raise SystemExit('Owned games unavailable; previous files retained')
              return {str(g['appid']):g for g in games if isinstance(g,dict) and isinstance(g.get('appid'),int) and g.get('name')}

          def metadata(app):
              code, body = request('https://store.steampowered.com/api/appdetails', {'appids':app,'l':'english','cc':'us'})
              item = body.get(app,{}) if isinstance(body,dict) else {}
              if code != 200 or not item.get('success') or not isinstance(item.get('data'),dict): return None
              d = item['data']; kind = d.get('type')
              if not isinstance(kind,str): return None
              return {'type':kind, 'header':d.get('header_image','') if kind=='game' else '', 'checked':NOW}

          def schema(app):
              code, body = api('ISteamUserStats/GetSchemaForGame/v2',{'appid':app,'l':'russian'})
              game = body.get('game') if isinstance(body,dict) else None
              if code != 200 or not isinstance(game,dict) or not game: return None
              rows = (game.get('availableGameStats') or {}).get('achievements',[])
              if not isinstance(rows,list): return None
              return {a['name']:{'name':a.get('displayName') or a['name'],'description':a.get('description',''),'icon':a.get('icon',''),'icongray':a.get('icongray',''),'hidden':bool(a.get('hidden'))} for a in rows if isinstance(a,dict) and a.get('name')}

          def main():
              if not KEY: raise SystemExit('Missing STEAM_API_KEY secret')
              old = read(OUT, read(Path('steam.json'),{}) if TEST else {})
              games = owned()
              playtime = dict(old.get('playtime',{})); baseline = dict(old.get('baseline',{}))
              first = 'baseline' not in old
              previous_apps = {str(r[0]) for r in old.get('library',[]) if isinstance(r,list) and len(r)>=2}
              for app,g in games.items():
                  minutes = max(0,int(g.get('playtime_forever',0)))
                  playtime[app]=minutes
                  # First discovery of older games must not count their historic hours toward the plan.
                  baseline.setdefault(app, minutes if first or not previous_apps or app in previous_apps else 0)
              catalog = dict(old.get('catalog',{})); summaries = dict(old.get('achievement_summary',{}))
              # Keep all old catalogue rows: temporary loss of visibility must not remove games from the plan.
              library = {str(r[0]):r for r in old.get('library',[]) if isinstance(r,list) and len(r)>=3}
              for app,g in games.items():
                  library[app]=[int(app),g['name'],playtime[app],g.get('img_icon_url','')]
              # Verify app type in small batches. Unclassified entries are not imported as games.
              candidates = sorted(games, key=lambda a:(catalog.get(a,{}).get('checked',0),int(a)))
              for app in [a for a in candidates if NOW-catalog.get(a,{}).get('checked',0)>30*86400][:24]:
                  m=metadata(app)
                  if m: catalog[app]=m
                  elif app not in catalog: catalog[app]={'type':'unknown','checked':NOW-29*86400}
              finished = dict(old.get('finished',{})); hidden=[]; unavailable=[]; errors={}; fetched={}
              # Preserve the exact existing story-finish rules, including cutoff and one-way history.
              for gid,g in GAMES.items():
                  app=str(g['app']); code,stats = fetched.get(app) or player(app); fetched[app]=(code,stats)
                  if 'not public' in str(stats.get('error','')).lower(): hidden.append(gid)
                  elif stats.get('success'):
                      times=[int(a.get('unlocktime',0)) for a in stats.get('achievements',[]) if a.get('apiname') in g['ach'] and a.get('achieved')]
                      if times and min(times)>=CUTOFF: finished[gid]=min(times)
                  elif code==400: unavailable.append(gid)
                  else: errors[gid]=code
              # Refresh the most recently played games first, then rotate oldest unchecked entries.
              # A finite batch keeps execution bounded; schema is cached per game for 30 days.
              eligible=[a for a in games if catalog.get(a,{}).get('type')=='game' or (a in fetched and fetched[a][1].get('success'))]
              active=sorted([a for a in eligible if games[a].get('playtime_2weeks',0)>0 and NOW-summaries.get(a,{}).get('checked',0)>=7200],key=lambda a:-games[a].get('playtime_2weeks',0))[:8]
              rest=sorted([a for a in eligible if a not in active and NOW-summaries.get(a,{}).get('checked',0)>=86400],key=lambda a:(summaries.get(a,{}).get('checked',0),int(a)))[:20]
              for app in active+rest:
                  path=DETAILS/(app+'.json'); prev=read(path,{})
                  code,stats=fetched.get(app) or player(app)
                  if not stats.get('success') or not isinstance(stats.get('achievements',[]),list):
                      # Keep previous successful snapshot; show stale status instead of fabricated zeros.
                      summaries[app]={**summaries.get(app,{}),'checked':NOW,'status':'unavailable' if code==400 else 'error'}
                      continue
                  rows=stats.get('achievements',[])
                  sch=prev.get('schema'); stamp=prev.get('schema_updated',0)
                  if not isinstance(sch,dict) or NOW-stamp>=30*86400:
                      fresh=schema(app)
                      if fresh is not None: sch=fresh; stamp=NOW
                  if not isinstance(sch,dict): sch={}
                  progress={a['apiname']:{'unlocked':bool(a.get('achieved')),'time':int(a.get('unlocktime') or 0),'name':a.get('name',''),'description':a.get('description','')} for a in rows if isinstance(a,dict) and a.get('apiname')}
                  # Do not publish unearned hidden descriptions; keep official grey icons only for ordinary locked items.
                  detail=[]
                  for k in sorted(set(sch)|set(progress)):
                      p=progress.get(k,{}); d=sch.get(k,{}); unlocked=p.get('unlocked',False); secret=d.get('hidden',False) and not unlocked
                      detail.append({'id':k,'name':'Скрытое достижение' if secret else d.get('name') or p.get('name') or k,'description':'' if secret else d.get('description') or p.get('description',''),'icon':'' if secret else (d.get('icon','') if unlocked else d.get('icongray','')),'unlocked':unlocked,'time':p.get('time',0)})
                  # Player API may omit rows; don't report an unknown count as zero when schema is missing.
                  count=sum(bool(a['unlocked']) for a in detail)
                  summaries[app]={'checked':NOW,'updated':NOW,'status':'ok' if detail else 'empty','unlocked':count,'total':len(detail)}
                  # Store only sanitized achievement metadata; original schema is needed for cached updates.
                  write(path,{'updated':NOW,'schema_updated':stamp,'schema':sch,'achievements':detail})
              out={**old,'finished':finished,'hidden':sorted(hidden),'unavailable':sorted(unavailable),'errors':errors,'playtime':playtime,'baseline':baseline,'library':sorted(library.values(),key=lambda r:r[0]),'catalog':catalog,'achievement_summary':summaries,'updated':NOW,'version':2}
              write(OUT,out)
              print(f'Owned={len(games)} catalog={len(catalog)} achievement summaries={len(summaries)} finished={len(finished)} test={TEST}')

          if __name__=='__main__': main()
          PY
      - name: Save the result
        env:
          TEST_MODE: ${{ inputs.test }}
        run: |
          if [ "$TEST_MODE" = true ]; then
            git add -- steam-test.json
            if [ -d steam-achievements-test ]; then git add -- steam-achievements-test; fi
          else
            git add -- steam.json
            if [ -d steam-achievements ]; then git add -- steam-achievements; fi
          fi
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Steam library and achievements"
          git pull --rebase
          git push
